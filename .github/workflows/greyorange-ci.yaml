# GreyOrange CI
#
# Checks for the greyorange-labs/teleport fork that run on standard GitHub
# hosted runners. The upstream workflows depend on larger runners
# (ubuntu-22.04-32core and similar) that only exist in the gravitational
# organisation, so they cannot run here.
#
# Every job runs inside the public upstream build image, which has the Go, Node,
# pnpm and Rust toolchains that the build needs.
#
# The `CI result` job is the one to mark as a required status check on
# `develop`: it fails if any of the other jobs fail.
name: GreyOrange CI
run-name: GreyOrange CI - ${{ github.run_id }} - @${{ github.actor }}

on:
  pull_request:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILDBOX_IMAGE: ghcr.io/gravitational/teleport-buildbox:teleport19

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            go:
              - '.github/workflows/greyorange-ci.yaml'
              - '**.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'build.assets/Makefile'
              - 'Makefile'
              - '.golangci.yml'
              - 'examples/greyorange/**'
            web:
              - '.github/workflows/greyorange-ci.yaml'
              - 'web/**'
              - 'gen/proto/ts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'Cargo.toml'
              - 'Cargo.lock'

  go-build-test:
    name: Go build and tests
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
      env:
        WEBASSETS_SKIP_BUILD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace as a git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check go.mod files are tidy
        run: |
          find . -path ./e -prune -o -name go.mod -print | while read f; do
            echo "checking $f"
            (cd "$(dirname "$f")" && go mod tidy -diff) || {
              echo "Run 'make go-mod-tidy-all' to fix $f"
              exit 1
            }
          done

      # Limited to the directories that are built here. The integrations are
      # separate modules with their own formatting.
      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files 'lib/*.go' 'tool/*.go' 'api/*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: |
          go build ./lib/... ./tool/...
          (cd api && go build ./...)

      - name: Vet the access request packages
        run: go vet ./lib/modules/... ./lib/auth/ ./lib/web/... ./lib/services/

      - name: Test modules
        run: go test -count=1 ./lib/modules/...

      - name: Test access request and role handling in the auth server
        run: >-
          go test -count=1 ./lib/auth/
          -run 'AccessRequest|RoleFeatureSupport|GreyOrange|TestUpsertRole|Moderated'

      - name: Test access request web endpoints
        run: >-
          go test -count=1 ./lib/web/
          -run 'AccessRequest|TestListRequestableRoles'

      - name: Test access request and role services
        run: go test -count=1 ./lib/services/ -run 'AccessRequest|Role'

  lint-go:
    name: Lint (Go)
    needs: changes
    # Only report issues introduced by the pull request, so the lint debt of
    # the upstream code base does not fail the check.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
      env:
        WEBASSETS_SKIP_BUILD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace as a git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set linter version
        run: echo GOLANGCI_LINT_VERSION=$(cd build.assets; make print-golangci-lint-version) >> $GITHUB_ENV

      - name: golangci-lint (api)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          # Disable verify as it downloads a json schema from an external CDN.
          verify: false
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: api
          only-new-issues: true
          skip-cache: true

      - name: golangci-lint (teleport)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          verify: false
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags bpf,libfido2,piv,tpmsimulator
          only-new-issues: true
          skip-cache: true

  web:
    name: Web (types, lint, format, tests)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
      # Some web tests spawn child processes and need a proper init process.
      options: --init
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print Node version
        run: node --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The type check needs the generated ironrdp package.
      - name: Install WASM dependencies
        run: make ensure-wasm-deps

      - name: Build WASM
        run: pnpm build-wasm

      - name: Type check
        run: pnpm type-check

      - name: oxlint
        run: pnpm oxlint --format github

      - name: Check formatting
        run: pnpm format-check

      - name: Tests
        run: pnpm test

  license-headers:
    name: License headers
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace as a git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check license headers
        run: make lint-license

  ci-result:
    name: CI result
    # A single status to require on protected branches. Skipped jobs (no
    # relevant files changed) count as passing.
    if: ${{ always() }}
    needs:
      - changes
      - go-build-test
      - lint-go
      - web
      - license-headers
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "At least one job did not pass."
              exit 1
            fi
          done
